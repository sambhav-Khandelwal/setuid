<style>

ound:#fff8df;border-color:#eee0ac;color:#73602c}.stat{font-size:32px;font-weight:750;letter-spacing:-1px}.statlabel{font-size:12px;color:var(--muted)}.platforms{display:flex;gap:9px;margin-top:18px}.platform{background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:7px;font-weight:750;font-size:14px}.field{display:grid;gap:7px;margin-top:16px}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd6c8;border-radius:9px;padding:12px;background:white;color:var(--ink);min-height:46px}.field textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #60905a;outline-offset:1px}.check{display:flex;gap:10px;align-items:flex-start;padding:12px 0;font-size:14px}.check input{width:19px;height:19px;accent-color:var(--green);flex-shrink:0;margin:2px 0}.check small{display:block;color:var(--muted)}.divider{border-top:1px solid var(--line);margin:20px 0}.empty{padding:25px 15px;border:1px dashed #ccd3c4;border-radius:12px;text-align:center;color:var(--muted)}.inline-link{border:0;background:none;padding:6px 0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:4px}.footer{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;margin-top:30px}.modalback{position:fixed;inset:0;background:#11190e66;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}.modal{background:#fff;border-radius:20px;width:560px;max-height:92vh;overflow:auto;padding:28px;box-shadow:0 30px 80px #15251333}.modalhead{display:flex;justify-content:space-between;align-items:start;gap:15px}.close{border:0;background:#f0f2eb;border-radius:50%;width:35px;height:35px;font-size:24px}.progress{display:flex;gap:6px;margin:20px 0}.progress span{height:5px;flex:1;background:#e9ece3;border-radius:4px}.progress span.on{background:var(--green)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;background:#17251b;color:#fff;padding:13px 21px;border-radius:12px;box-shadow:0 8px 25px #0002;max-width:90%;display:none}.notice{font-size:11px;padding:7px 11px;background:#f2f3ed;border-radius:6px;color:#65705b}.refquote{font-size:16px;line-height:1.65;padding:17px 0}.mobbrand{display:none}.statusline{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}details{border-bottom:1px solid var(--line);padding:16px 0}summary{font-weight:650;cursor:pointer}details p{margin-top:12px;font-size:14px}@media(min-width:1550px){.hero{min-height:330px}.herotext{padding:43px 45px}h1{font-size:51px}}@media(max-width:1100px){.sidebar{width:205px;padding:25px 14px}.main{margin-left:205px}.page{padding:28px 25px}.topbar{padding:0 25px}.cols{grid-template-columns:1fr}.hero{grid-template-columns:1.3fr 1fr}.herotext{padding:28px}h1{font-size:36px}.pass{width:195px}.float{right:8px;font-size:11px}}@media(max-width:720px){.sidebar{inset:auto 0 0;width:100%;height:72px;padding:5px 4px;border:0;border-top:1px solid var(--line);z-index:5}.sidebar .logo,.sidebar .caption,.sidebottom{display:none}.nav{display:flex;justify-content:space-around;gap:0;height:100%}.nav button{padding:7px 4px;gap:4px;flex-direction:column;font-size:10px;border-radius:9px;min-width:50px}.nav button.active{background:#fff3be}.nav svg{width:20px;height:20px}.main{margin:0}.topbar{height:68px;padding:0 19px}.desktopcrumb{display:none}.mobbrand{display:flex;font-size:24px}.topright{gap:9px}.topright .avatar{display:none}.notice{font-size:10px}.page{padding:23px 18px 100px}.pagehead{align-items:start}.pagehead h2{font-size:23px}.pagehead p{font-size:13px}.pagehead>.btn{padding:9px 11px;font-size:12px;min-height:39px}.hero{grid-template-columns:1fr;min-height:0}.herotext{padding:27px}.hero h1{font-size:37px;max-width:300px}.art{display:none}.three{gap:8px}.three .card{padding:16px 12px}.stat{font-size:26px}.statlabel{font-size:11px}.two{grid-template-columns:1fr}.card{padding:20px}.section{margin-top:22px}.footer{display:block}.footer span{display:block;margin:6px 0}.modal{padding:22px}.row .actions{margin-top:10px}.row{flex-wrap:wrap}.profiletop h2{font-size:23px}}@media print{.sidebar,.topbar,.footer,.btn,.inline-link,#toast,.modalback{display:none!important}.main{margin:0}.page{padding:0}.card{break-inside:avoid}.cols,.two{display:block}.card{margin-bottom:16px}body{background:white}}
</style>

<body><div id="app"></div><div id="modalroot"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='setuid-redesign-v2';
const seed=()=>({profile:{name:'Aarav Sharma',role:'Driver & delivery partner',city:'Ajmer, Rajasthan',contact:'Ask me for my preferred contact number'},jobs:[{id:'sample-job',role:'Local delivery driver',company:'Sample delivery business',start:'2024-06',end:'2026-10',vehicle:'Motorcycle',tasks:'Local parcel deliveries, route planning and customer handovers.'}],refs:[],shares:[],corrections:[],steps:[],lang:'en'});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!db.profile||!Array.isArray(db.jobs)||!Array.isArray(db.refs)||!Array.isArray(db.shares))db=seed()}catch{db=seed()}
let page='home',shareId=null,setupStep=0,draft={},lastFocus=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const date=d=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const now=()=>new Date().toISOString();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('Changes work for this session, but this browser could not save them.');return false}}
let toastTimer;function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',4200)}
const paths={home:'M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',work:'M8 6V4h8v2M3 7h18v14H3ZM3 12h18M10 12v3h4v-3',refs:'M8 3h8v4H8ZM6 5H4v16h16V5h-2M8 12l2 2 5-5M8 18h8',share:'M12 16V3m-5 5 5-5 5 5M4 13v8h16v-8',hirer:'M15 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0M3 21v-2a6 6 0 0 1 12 0v2M17 13l2 2 4-4',help:'M12 17v.1M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',arrow:'M4 12h16m-6-6 6 6-6 6',check:'m5 12 4 4L19 6',pin:'M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0M14 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0',shield:'M12 3 3 7v6c0 5 9 9 9 9s9-4 9-9V7ZM8 12l3 3 5-6',phone:'M5 3h4l2 5-3 2a17 17 0 0 0 6 6l2-3 5 2v4c0 3-5 2-8 0C7 16 3 10 3 6c0-2 0-3 2-3'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.work}"/></svg>`;
const t=(en,hi)=>db.lang==='hi'?hi:en;
const tag=(s,c='')=>`<span class="tag ${c}">${esc(s)}</span>`;
const button=(label,act,cls='')=>`<button class="btn ${cls}" data-act="${act}">${label}</button>`;
const active=s=>!s.withdrawn&&new Date(s.expires)>new Date();
const status=s=>s.withdrawn?'Withdrawn':active(s)?'Active on this device':'Expired';
const period=j=>`${j.start||'Date not added'} — ${j.end||'Present'}`;
function shell(content){const nav=[['home',t('Home','होम')],['work',t('My work','मेरा काम')],['refs',t('References','रेफ़रेंस')],['share',t('Sharing','शेयरिंग')],['hirer',t('Hirer view','नियोक्ता')],['help',t('Help','सहायता')]];$('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo"><span>↗</span>setuID</div><div class="caption">Your work. Your say.</div><nav class="nav" aria-label="Main navigation">${nav.map(([id,n])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(id)}${n}</button>`).join('')}</nav><div class="sidebottom">${icon('shield')}<h3>Your record, in your control.</h3><p>You choose what to show and who to show it to.</p><button class="inline-link" data-act="privacy">How sharing works</button></div></aside><div class="main"><header class="topbar"><div class="desktopcrumb"><small>Your workspace / </small><strong>${nav.find(n=>n[0]===page)?.[1]||'Home'}</strong></div><div class="logo mobbrand"><span>↗</span>setuID</div><div class="topright"><span class="notice">Fictional demo · local only</span><button class="btn light small" data-act="language" aria-label="Switch interface language">${db.lang==='hi'?'English':'हिन्दी'}</button><div class="avatar">${esc(db.profile.name.slice(0,1))}</div></div></header><main class="page" id="main">${content}<footer class="footer"><span>SetuID / Student research prototype</span><span>No platform data connected. Records stay in this browser.</span></footer></main></div></div>`}
function head(title,sub,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function jobCard(j,controls=true){return `<div class="row"><div class="flex" style="align-items:start"><div class="workicon">${icon('work')}</div><div><h3>${esc(j.role)}</h3><p>${esc(j.company)} · ${esc(j.vehicle)}</p><p>${esc(period(j))}</p><p>${esc(j.tasks)}</p><div class="statusline">${tag('Worker says this','amber')}</div></div></div>${controls?`<button class="btn light small" data-edit-job="${esc(j.id)}">Edit</button>`:''}</div>`}
function home(){shell(`${head(t('Let your experience do the talking.','आपका अनुभव, आपकी पहचान।'),t('A clearer work record. One opportunity at a time.','अपने काम की जानकारी आसानी से दिखाएँ।'),button(t('Preview my profile','प्रोफ़ाइल देखें'),'selfpreview','light small'))}<section class="hero"><div class="herotext"><div class="eyebrow">Made for your next opportunity</div><h1>${t('Your work.<br>Your story.<br>Your next move.','आपका काम।<br>आपकी कहानी।<br>अगला अवसर।')}</h1><p>${t('Bring your experience and references together. Share only what you choose.','अनुभव और रेफ़रेंस एक जगह रखें। जो चाहें, वही शेयर करें।')}</p><div class="actions">${button(t('Get my profile ready','प्रोफ़ाइल तैयार करें')+' '+icon('arrow'),'setup')}${button(t('I’m hiring','मुझे कर्मचारी चाहिए'),'hirer','light')}</div></div><div class="art" aria-hidden="true"><div class="pass"><div class="caption">SetuID / Work record</div><div class="avatar">${esc(db.profile.name[0])}</div><h3>${esc(db.profile.name)}</h3><p class="smalltext">${esc(db.profile.role)}</p><div class="stripe"></div><div class="stripe" style="width:56%"></div><div class="stamp">WORKER-CONTROLLED PROFILE</div></div><div class="float">${icon('shield')} Shared on your terms</div></div></section><div class="grid three section"><div class="card"><div class="stat">${db.jobs.length.toString().padStart(2,'0')}</div><div class="statlabel">Work experiences</div></div><div class="card"><div class="stat">${db.refs.filter(r=>r.outcome==='recorded').length.toString().padStart(2,'0')}</div><div class="statlabel">Reference responses</div></div><div class="card"><div class="stat">${db.shares.filter(active).length.toString().padStart(2,'0')}</div><div class="statlabel">Active local previews</div></div></div><div class="grid cols section"><section><div class="sectionhead"><h2>Your next steps</h2><span class="smalltext muted">Go at your pace</span></div><div class="card"><div class="step"><div class="stepnum done">${icon('check')}</div><div><h3>Start with your work</h3><p>Role, dates, vehicle and the tasks you actually handled.</p><button class="inline-link" data-page="work">Review my experience →</button></div></div><div class="step"><div class="stepnum">02</div><div><h3>Have a job in mind?</h3><p>Add the hirer and role. You can prepare without contacting anyone.</p><button class="inline-link" data-act="opportunity">${db.opportunity?esc(db.opportunity.hirer)+' · Edit opportunity':'Add an opportunity →'}</button></div></div><div class="step"><div class="stepnum">03</div><div><h3>Ask the right person, with permission</h3><p>A former supervisor can describe work they directly observed.</p><button class="inline-link" data-page="refs">Prepare a reference request →</button></div></div></div></section><aside><div class="sectionhead"><h2>A little help goes a long way</h2></div><div class="card soft">${icon('phone')}<h2 style="margin-top:12px">Let’s do it together.</h2><p style="margin-top:9px">A friend or pilot helper can walk through the form with you. You approve every step.</p>${button('Start guided setup','setup','light')}</div><div class="card" style="margin-top:16px"><h3>Built around the way you work</h3><div class="platforms"><span class="platform" style="background:#ffdf41">Rapido</span><span class="platform" style="background:#e3efbf">OLA</span><span class="platform" style="background:#191919;color:white">Uber</span></div><p class="smalltext" style="margin-top:12px">Proposed connections only. SetuID cannot import ratings, documents or work history from these platforms.</p></div></aside></div>`)}
function work(){shell(`${head('My work, in one place.','Add relevant experience. Keep private documents out of your shareable profile.',button('Add experience','job','yellow'))}<div class="grid cols"><div class="card"><div class="profiletop"><div class="avatar">${esc(db.profile.name[0])}</div><div><h2>${esc(db.profile.name)}</h2><p>${esc(db.profile.role)}</p><p class="smalltext">${esc(db.profile.city)}</p></div></div><button class="inline-link" data-act="editprofile">Edit personal details</button><div class="divider"></div><h3>Work experience</h3>${db.jobs.length?db.jobs.map(j=>jobCard(j)).join(''):'<div class="empty">Start with your most recent role.</div>'}</div><aside><div class="card soft"><h2>Specific beats a score.</h2><p style="margin-top:12px">Tell a delivery hirer about your routes, vehicle and handovers. A different role may need a different reference.</p><div class="note">There is no overall trust score. Each claim keeps its source visible.</div></div><div class="card" style="margin-top:20px"><h3>Have something to correct?</h3><p style="margin-top:8px">Flag a specific statement and add your response. Disputed references are blocked from new previews.</p>${button('Request a correction','correction','light')}</div></aside></div>`)}
function referenceCard(r,hirer=false){const j=db.jobs.find(j=>j.id===r.job);return `<div class="card" style="margin-top:16px"><div class="sectionhead"><div><h3>${esc(r.name)}</h3><p class="smalltext">${esc(r.relationship)} · ${esc(j?.company||'Work entry removed')}</p></div>${tag(r.disputed?'Disputed':r.outcome==='recorded'?'Response recorded':r.outcome==='unreachable'?'Could not reach':'Not contacted',r.disputed?'red':r.outcome==='recorded'?'':'amber')}</div><p class="smalltext">For: ${esc(j?.role||'Previous work')} · Permission recorded ${date(r.created)}</p>${r.statement?`<p class="refquote">“${esc(r.statement)}”</p>`:''}<div class="note"><strong>Who said this?</strong> ${r.outcome==='recorded'?esc(r.name)+' · '+esc(r.method)+' · '+date(r.recorded):'No conversation has been recorded.'}<br><strong>Employer relationship:</strong> ${r.relationEvidence?esc(r.relationEvidence):'Not independently checked.'}${r.outcome==='recorded'?'<br>A recorded answer is not proof of employment or future performance.':''}</div>${r.disputed?'<div class="note amber">Worker has challenged this entry. Do not rely on it while the correction is open.</div>':''}${!hirer?`<div class="actions"><button class="btn light small" data-record-ref="${esc(r.id)}">Record contact outcome</button><button class="inline-link" data-request-copy="${esc(r.id)}">Copy request text</button></div>`:''}</div>`}
function refs(){shell(`${head('References you can understand.','A person’s answer and proof of their employer relationship are different things.',button('Prepare request','request','yellow'))}<div class="grid cols"><section><div class="note amber" style="margin:0">Nothing is sent automatically. Ask the worker before contacting a current or former employer.</div>${db.refs.length?db.refs.map(r=>referenceCard(r)).join(''):'<div class="card section"><div class="empty">No reference requests yet.<br>Start with a role and someone who supervised that work.</div><div class="actions">'+button('Prepare my first request','request')+'</div></div>'}</section><aside class="card" style="align-self:start"><h2>Read the source, not a badge.</h2><div class="step"><div class="stepnum">1</div><div><h3>Worker says this</h3><p>The worker supplied the work details.</p></div></div><div class="step"><div class="stepnum">2</div><div><h3>Response recorded</h3><p>A helper recorded a reference conversation, including date and method.</p></div></div><div class="step"><div class="stepnum">3</div><div><h3>Relationship evidence</h3><p>Read how the connection to the business was checked, or see that it was not checked.</p></div></div></aside></div>`)}
function sharing(){shell(`${head('Share less. Stay in control.','Create a named preview, check it, then decide.',button('Create preview','share','yellow'))}<div class="grid cols"><div class="card"><h2>Your previews</h2>${db.shares.length?db.shares.map(s=>`<div class="row"><div><h3>${esc(s.hirer)}</h3><p>${esc(s.role)} · ${s.jobs.length} work entries</p><p>Expires ${date(s.expires)}</p>${tag(status(s),active(s)?'':'gray')}</div><div class="actions" style="margin-top:0">${active(s)?`<button class="btn light small" data-view-share="${s.id}">Open preview</button><button class="btn danger small" data-withdraw="${s.id}">Withdraw</button>`:''}</div></div>`).join(''):'<div class="empty section">No one has a preview yet. You decide when to create one.</div>'}</div><aside class="card soft" style="align-self:start"><h2>You see it first.</h2><p style="margin-top:12px">Choose work entries, references and whether to show your preferred contact route.</p><div class="note">Home address and identity documents are never part of this profile.</div><div class="note">Previews open on this device only. Withdrawal and expiry stop future viewing here; they cannot remove screenshots or information already seen.</div></aside></div>`)}
function profileView(jobs,refs,contact){return `<div class="card"><div class="profiletop"><div class="avatar">${esc(db.profile.name[0])}</div><div><h2>${esc(db.profile.name)}</h2><p>${esc(db.profile.role)} · ${esc(db.profile.city)}</p></div></div>${tag('Fictional demonstration profile','amber')}<h3 style="margin-top:22px">Relevant work</h3>${jobs.map(j=>jobCard(j,false)).join('')||'<p>No work entries selected.</p>'}${contact?`<div class="note"><strong>Preferred contact route</strong><br>${esc(db.profile.contact)}</div>`:''}<div class="note">Selected information only. This is not a complete work history, identity check or recommendation to hire.</div></div><h2 style="margin-top:25px">Reference details</h2>${refs.map(r=>referenceCard(r,true)).join('')||'<div class="card section"><p>No references selected. Ask the worker what else they can provide.</p></div>'}`}
function hirer(){const s=db.shares.find(x=>x.id===shareId);if(!s||!active(s)){shell(`${head('A better starting point for a conversation.','Use relevant work details to prepare your own checks.')}<div class="grid cols"><div class="card"><div class="eyebrow">For independent local hirers</div><h2>Hiring someone outside your network?</h2><p style="margin-top:13px">Start with the job, previous tasks and a reference’s relationship to the worker. Speak to the person and decide whether a trial makes sense.</p><div class="note amber">${s?'This preview is '+status(s).toLowerCase()+'. Its contents are no longer available here.':'A worker-approved preview is needed before candidate details appear here.'}</div><div class="actions">${button('Create worker-approved preview','share')}${button('See my own profile','selfpreview','light')}</div></div><div class="card soft"><h2>Useful questions</h2><div class="step"><div class="stepnum">1</div><div><h3>Is the work relevant?</h3><p>Compare tasks and vehicle type with your vacancy.</p></div></div><div class="step"><div class="stepnum">2</div><div><h3>Who knows this first-hand?</h3><p>Read the relationship evidence. Call the reference yourself if needed.</p></div></div><div class="step"><div class="stepnum">3</div><div><h3>What still needs checking?</h3><p>Documents, suitability and trial outcomes remain separate.</p></div></div></div></div>`);return}shell(`${head('Work details. Clear sources. Your next step.',`Local preview for ${esc(s.hirer)} · ${esc(s.role)} · Expires ${date(s.expires)}`,button('Sharing controls','sharing','light small'))}<div class="grid cols"><section>${profileView(db.jobs.filter(j=>s.jobs.includes(j.id)),db.refs.filter(r=>s.refs.includes(r.id)),s.contact)}</section><aside><div class="card"><div class="eyebrow">After your review</div><h2>What happens next?</h2><p style="margin-top:10px">Record what actually happened. These notes stay on this device.</p><form id="next-form" data-id="${s.id}"><div class="field"><label for="next">Next step</label><select id="next" name="next"><option>Call the reference</option><option>Speak to the applicant</option><option>Trial arranged</option><option>No next step</option></select></div><div class="field"><label for="reason">What did you check or still need?</label><textarea id="reason" name="reason" required></textarea></div><button class="btn" style="margin-top:15px">Save observation</button></form></div><div class="card section"><h3>Recruitment notes</h3>${(s.notes||[]).map(n=>`<div class="row"><div><strong>${esc(n.next)}</strong><p>${esc(n.reason)}</p><p>${date(n.at)}</p></div></div>`).join('')||'<p class="smalltext" style="margin-top:10px">No next step recorded. A profile view does not establish a hire.</p>'}</div></aside></div>`)}
function help(){shell(`${head('A simpler way through.','Help for workers, helpers and hirers.')}<div class="grid cols"><div class="card"><h2>Common questions</h2>${[['Can I get help filling this in?','Yes. Use guided setup with a friend or pilot helper. Read the details back to the worker before saving.'],['Will my employer be contacted automatically?','No. Preparing a request only saves it locally. You must separately agree to contact and send the request yourself.'],['Is this accepted by Rapido, Ola or Uber?','No acceptance or integration has been established. Platform joining requirements remain separate. This prototype tests independent local hiring.'],['Is a recorded reference verified?','A response means someone’s answer was recorded. Read the relationship evidence separately. There is no universal reliability badge.'],['Can I remove access?','Withdraw a preview in Sharing. Expired or withdrawn previews cannot be opened again here. Previously viewed or copied information cannot be recalled.'],['What happens if a reference is unfair?','Flag the entry and add your response. It will be marked disputed, excluded from new previews, and existing previews containing it will be withdrawn. Resolution needs a real review outside this demo.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div><aside><div class="card soft"><h2>Let’s set it up together.</h2><p style="margin-top:10px">Three short steps. No identity documents needed.</p>${button('Start guided setup','setup')}</div><div class="card section"><h3>Corrections</h3>${db.corrections?.length?db.corrections.map(c=>`<div class="row"><div><strong>${esc(c.text)}</strong><p>Worker response: ${esc(c.response)}</p>${tag('Awaiting review','amber')}</div></div>`).join(''):'<p style="margin-top:10px">No corrections requested.</p>'}${button('Flag a statement','correction','light')}</div><div class="actions">${button('Export local data','export','light small')}${button('Reset sample','reset','danger small')}</div></aside></div>`)}
function render(){({home,work,refs,share:sharing,hirer,help}[page]||home)()}
function openModal(title,body){lastFocus=document.activeElement;$('#modalroot').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="modalhead"><h2 id="dialogtitle">${title}</h2><button class="close" data-act="close" aria-label="Close dialog">×</button></div>${body}</section></div>`;setTimeout(()=>$('#modalroot input, #modalroot select, #modalroot textarea, #modalroot .close')?.focus(),0)}
function closeModal(){ $('#modalroot').innerHTML='';lastFocus?.isConnected&&lastFocus.focus() }
const field=(label,name,value='',type='text',required=true)=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`;
const area=(label,name,value='',required=true)=>`<div class="field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${required?'required':''}>${esc(value)}</textarea></div>`;
const check=(name,text,required=true)=>`<label class="check"><input type="checkbox" name="${name}" ${required?'required':''}><span>${text}</span></label>`;
function setup(){const body=[`<p class="section">Start with a name and the work you want to show.</p>${field('Name','name',draft.name??db.profile.name)}${field('Current or desired role','role',draft.role??db.profile.role)}${field('City (no home address)','city',draft.city??db.profile.city)}`,`<p class="section">A specific opportunity helps you decide which experience matters.</p>${field('Hirer or business (optional)','hirer',draft.hirer??db.opportunity?.hirer??'','text',false)}${field('Role being considered (optional)','vacancy',draft.vacancy??db.opportunity?.role??'','text',false)}<div class="note">You can leave this blank. No one is contacted.</div>`,`<div class="note section"><strong>${esc(draft.name)}</strong><br>${esc(draft.role)} · ${esc(draft.city)}<br>${draft.hirer?'Opportunity: '+esc(draft.hirer)+' · '+esc(draft.vacancy):'No opportunity added yet.'}</div>${check('approval','I reviewed these details, or read them back to the worker, and they agree to save them.')}<p class="smalltext">Next, add work experience or prepare a reference request. You stay in control.</p>`];openModal(['Let’s start with you.','Have a job in mind?','Check before saving.'][setupStep],`<div class="caption section">Guided setup · ${setupStep+1} of 3</div><div class="progress">${[0,1,2].map(i=>`<span class="${i<=setupStep?'on':''}"></span>`).join('')}</div><form id="setup-form">${body[setupStep]}<div class="actions">${setupStep?'<button type="button" class="btn light" data-act="setupback">Back</button>':''}<button class="btn">${setupStep===2?'Save my details':'Continue '+ '→'}</button></div></form>`)}
function jobModal(j){openModal(j?'Edit experience':'Add work experience',`<form id="job-form" data-id="${j?.id||''}">${field('Role','role',j?.role)}${field('Business or employer','company',j?.company)}<div class="grid two">${field('Start month','start',j?.start,'month')}${field('End month (blank if current)','end',j?.end,'month',false)}</div>${field('Vehicle or relevant equipment','vehicle',j?.vehicle)}${area('What tasks did you handle?','tasks',j?.tasks)}<div class="note">These details are labelled “Worker says this”.</div><div class="actions"><button class="btn">Save experience</button>${j?`<button type="button" class="btn danger" data-delete-job="${j.id}">Remove</button>`:''}</div></form>`)}
function request(){if(!db.jobs.length){toast('Add a work experience first.');page='work';render();return}openModal('Prepare a reference request',`<p class="section">Choose someone who saw this work first-hand.</p><form id="request-form"><div class="field"><label for="jobselect">Work to ask about</label><select id="jobselect" name="job">${db.jobs.map(j=>`<option value="${j.id}">${esc(j.role)} · ${esc(j.company)}</option>`).join('')}</select></div>${field('Reference’s name','name')}${field('Relationship to worker','relationship','','text',true)}${area('What do you want to ask?','questions','What tasks did the worker handle? What were their employment dates? What did you observe about attendance? Would you employ them again?')}${check('permission','The worker agrees to contact this person for this role. No message will be sent by this prototype.')}<button class="btn">Save request locally</button></form>`)}
function record(r){openModal('Record what actually happened',`<p class="section">Reference: ${esc(r.name)}. Enter an actual outcome, not a hoped-for answer.</p><form id="record-form" data-id="${r.id}"><div class="field"><label for="outcome">Contact outcome</label><select id="outcome" name="outcome"><option value="pending">Not contacted yet</option><option value="unreachable">Could not reach</option><option value="recorded">Response recorded</option></select></div>${area('What did the reference say? Required for a recorded response.','statement',r.statement,false)}${field('Contact method (required for a response)','method',r.method,'text',false)}${field('Date of contact (required for a response)','recorded',r.recorded?.slice(0,10)||'','date',false)}${area('How was their employer relationship checked? Leave blank if not independently checked.','relationEvidence',r.relationEvidence,false)}${check('honest','This records a contact outcome accurately. A response alone does not verify an employer relationship.')}<div class="actions"><button class="btn">Save outcome</button></div></form>`);$('#outcome').value=r.outcome}
function shareModal(){if(!db.jobs.length){toast('Add work experience before creating a preview.');page='work';render();return}openModal('Choose what the hirer sees',`<form id="share-form">${field('Hirer or business','hirer',db.opportunity?.hirer)}${field('Role being considered','role',db.opportunity?.role)}<div class="field"><label for="days">Preview expires after</label><select name="days" id="days"><option value="1">1 day</option><option value="7" selected>7 days</option><option value="30">30 days</option></select></div><h3 class="section">Work to include</h3>${db.jobs.map(j=>`<label class="check"><input name="jobs" type="checkbox" value="${j.id}" checked><span>${esc(j.role)}<small>${esc(j.company)} · Worker says this</small></span></label>`).join('')}<h3 class="section">References to include</h3>${db.refs.filter(r=>r.outcome==='recorded'&&!r.disputed).map(r=>`<label class="check"><input type="checkbox" name="refs" value="${r.id}"><span>${esc(r.name)}<small>Response recorded · ${r.relationEvidence?'Read relationship evidence':'Relationship not independently checked'}</small></span></label>`).join('')||'<p class="smalltext">No undisputed recorded responses yet. You can still show work experience.</p>'}${check('contact','Include my preferred contact route',false)}<div class="note">No home address or identity documents. Opens only in this browser.</div>${check('approval','I approve these selected details for this named hirer.')}<button class="btn">Create & review preview</button></form>`)}
function correction(){openModal('Flag a statement',`<form id="correction-form"><div class="field"><label for="target">Entry</label><select name="target" id="target"><option value="profile">Profile / work details</option>${db.refs.map(r=>`<option value="${r.id}">Reference: ${esc(r.name)}</option>`).join('')}</select></div>${area('What is incorrect or unfair?','text')}${area('Your response or requested change','response')}<div class="note">Flagging a reference marks it disputed and withdraws existing previews that contain it. It will need a real review.</div><div class="actions"><button class="btn">Submit correction locally</button></div></form>`)}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Request text copied. You decide whether to send it.')}catch{openModal('Copy your request',`<p class="section">Select and copy this text. Nothing has been sent.</p>${area('Request text','copy',text,false)}`)}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){page=n.dataset.page;render();window.scrollTo(0,0);return}const el=e.target.closest('button');if(!el)return;const a=el.dataset.act;
if(a==='close')closeModal();if(a==='language'){db.lang=db.lang==='hi'?'en':'hi';persist();render();toast(db.lang==='hi'?'मुख्य नेविगेशन हिन्दी में है। विस्तृत फ़ॉर्म के लिए सहायक की मदद लें।':'Interface language: English')}
if(a==='setup'){draft={};setupStep=0;setup()}if(a==='setupback'){const f=$('#setup-form');if(f)Object.assign(draft,Object.fromEntries(new FormData(f)));setupStep--;setup()}
if(a==='job')jobModal();if(a==='request')request();if(a==='share')shareModal();if(a==='correction')correction();if(a==='hirer'){page='hirer';render()}if(a==='sharing'){page='share';render()}
if(a==='privacy')openModal('Your sharing controls',`<div class="section"><p>Only selected work entries, selected references, your name, role and city appear in a preview. Your contact route is optional.</p><div class="note">Previews stay on this device. No link is sent to a hirer. Withdrawal cannot recall information already copied.</div><div class="actions">${button('Manage previews','manageshares')}</div></div>`);
if(a==='manageshares'){closeModal();page='share';render()}
if(a==='editprofile')openModal('Edit your details',`<form id="profile-form">${field('Name','name',db.profile.name)}${field('Role','role',db.profile.role)}${field('City','city',db.profile.city)}${field('Preferred contact route','contact',db.profile.contact)}<div class="actions"><button class="btn">Save details</button></div></form>`);
if(a==='opportunity')openModal('Your next opportunity',`<form id="opportunity-form">${field('Hirer or business','hirer',db.opportunity?.hirer)}${field('Role being considered','role',db.opportunity?.role)}<div class="note">No application or message is sent.</div><div class="actions"><button class="btn">Save opportunity</button></div></form>`);
if(a==='selfpreview')openModal('Your profile preview',`<p class="section smalltext">Only you are viewing this. A hirer sees only the entries you select when sharing.</p><div class="section">${profileView(db.jobs,db.refs,false)}</div>`);
if(el.dataset.editJob)jobModal(db.jobs.find(j=>j.id===el.dataset.editJob));
if(el.dataset.deleteJob){if(confirm('Remove this work entry? Related references will also be removed and related previews withdrawn.')){const id=el.dataset.deleteJob;const refids=db.refs.filter(r=>r.job===id).map(r=>r.id);db.shares.forEach(s=>{if(s.jobs.includes(id)||s.refs.some(i=>refids.includes(i)))s.withdrawn=true});db.jobs=db.jobs.filter(j=>j.id!==id);db.refs=db.refs.filter(r=>r.job!==id);persist();closeModal();render()}}
if(el.dataset.recordRef)record(db.refs.find(r=>r.id===el.dataset.recordRef));
if(el.dataset.requestCopy){const r=db.refs.find(r=>r.id===el.dataset.requestCopy),j=db.jobs.find(j=>j.id===r.job);copyText(`Hello ${r.name}, with ${db.profile.name}'s permission, we would like to ask about their work as ${j?.role} at ${j?.company}. ${r.questions} Please answer only what you directly observed. May we record and share your response with the selected hirer?`)}
if(el.dataset.viewShare){shareId=el.dataset.viewShare;page='hirer';render()}
if(el.dataset.withdraw){const s=db.shares.find(s=>s.id===el.dataset.withdraw);s.withdrawn=true;persist();render();toast('Preview withdrawn. Already copied information cannot be recalled.')}
if(a==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=u;link.download='SetuID_Local_Data.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
if(a==='reset'&&confirm('Delete this redesigned prototype’s local changes and restore the sample?')){db=seed();shareId=null;persist();page='home';render();toast('Fictional sample restored.')}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f),v=Object.fromEntries(d),trim=k=>String(v[k]||'').trim();for(const input of f.querySelectorAll('[required]')){if(input.type!=='checkbox'&&input.type!=='select-one'&&!input.value.trim()){toast('Please complete the required fields.');input.focus();return}}
if(f.id==='setup-form'){Object.assign(draft,v);if(setupStep<2){setupStep++;setup();return}Object.assign(db.profile,{name:draft.name.trim(),role:draft.role.trim(),city:draft.city.trim()});if(draft.hirer)db.opportunity={hirer:draft.hirer.trim(),role:(draft.vacancy||'Role to discuss').trim()};page='work'}
if(f.id==='profile-form'){for(const k of ['name','role','city','contact'])db.profile[k]=trim(k)}
if(f.id==='opportunity-form')db.opportunity={hirer:trim('hirer'),role:trim('role')};
if(f.id==='job-form'){if(v.end&&v.end<v.start){toast('End month must be after the start month.');return}const job={id:f.dataset.id||uid(),role:trim('role'),company:trim('company'),start:v.start,end:v.end,vehicle:trim('vehicle'),tasks:trim('tasks')};const i=db.jobs.findIndex(j=>j.id===job.id);if(i<0)db.jobs.push(job);else db.jobs[i]=job;page='work'}
if(f.id==='request-form'){if(!v.permission){toast('Worker permission is required.');return}db.refs.push({id:uid(),job:v.job,name:trim('name'),relationship:trim('relationship'),questions:trim('questions'),created:now(),outcome:'pending',disputed:false});page='refs'}
if(f.id==='record-form'){if(v.outcome==='recorded'&&(!trim('statement')||!trim('method')||!v.recorded)){toast('Add the actual statement, contact method and date.');return}if(v.recorded&&v.recorded>now().slice(0,10)){toast('The contact date cannot be in the future.');return}const r=db.refs.find(r=>r.id===f.dataset.id);Object.assign(r,{outcome:v.outcome,statement:v.outcome==='recorded'?trim('statement'):'',method:trim('method'),recorded:v.recorded?new Date(v.recorded+'T12:00:00').toISOString():null,relationEvidence:trim('relationEvidence')});page='refs'}
if(f.id==='share-form'){const jobs=d.getAll('jobs'),refs=d.getAll('refs');if(!jobs.length){toast('Choose at least one relevant work entry.');return}if(refs.some(id=>!jobs.includes(db.refs.find(r=>r.id===id)?.job))){toast('Include the related work entry for each selected reference.');return}const s={id:uid(),hirer:trim('hirer'),role:trim('role'),jobs,refs,contact:!!v.contact,created:now(),expires:new Date(Date.now()+Number(v.days)*86400000).toISOString(),withdrawn:false,notes:[]};db.shares.unshift(s);shareId=s.id;page='hirer'}
if(f.id==='next-form'){const s=db.shares.find(s=>s.id===f.dataset.id);if(!s||!active(s)){toast('This preview has expired or been withdrawn.');render();return}s.notes.push({next:v.next,reason:trim('reason'),at:now()})}
if(f.id==='correction-form'){db.corrections??=[];db.corrections.unshift({id:uid(),target:v.target,text:trim('text'),response:trim('response'),at:now()});const r=db.refs.find(r=>r.id===v.target);if(r){r.disputed=true;db.shares.forEach(s=>{if(s.refs.includes(r.id))s.withdrawn=true})}page='help'}
const saved=persist();closeModal();render();if(saved)toast(f.id==='request-form'?'Request saved locally. No one has been contacted.':'Saved on this device.');
});
document.addEventListener('keydown',e=>{const modal=$('#modalroot .modal');if(!modal)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const all=[...modal.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled);const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
setInterval(()=>{if(page==='hirer'&&shareId){const s=db.shares.find(s=>s.id===shareId);if(s&&!active(s))render()}},30000);
render();
</script></body></html>
